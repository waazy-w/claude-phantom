name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm run lint
      - run: npm test
      # The site advertises a version and a test count; catch them drifting here
      # rather than after a release has shipped past them.
      - run: npm run check-site
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
